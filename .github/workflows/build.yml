name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      gecko_version:
        description: "GeckoView version (leave empty = newest stable)"
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Find newest stable GeckoView
        run: |
          V="${{ github.event.inputs.gecko_version }}"
          if [ -z "$V" ]; then
            META=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml)
            V=$(echo "$META" | grep -oP '(?<=<release>)[^<]+' || true)
            if [ -z "$V" ]; then V=$(echo "$META" | grep -oP '(?<=<latest>)[^<]+'); fi
          fi
          echo "Using GeckoView $V"
          echo "GECKO=$V" >> "$GITHUB_ENV"
      - name: Build
        run: gradle :app:assembleRelease -PgeckoVersion="$GECKO" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LiteBrowser-apks
          path: app/build/outputs/apk/**/release/*.apk
